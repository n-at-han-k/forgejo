name: Build image

# Builds this branch into a container image published to GHCR.
#
# The upstream Forgejo workflows are removed on this branch: they target
# codeberg's release, mirror and PR automation and its runner labels, none of
# which apply to a fork that only needs an image built.
on:
  push:
    branches:
      - v16.x.x-project-api
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    concurrency:
      group: build-image
      cancel-in-progress: true

    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/forgejo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and tags: the Makefile derives FORGEJO_VERSION from
          # `git describe --tags`, and a depth-1 checkout has no tag to describe,
          # which leaves the running instance reporting an empty version.
          fetch-depth: 0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Derive version
        id: version
        run: |
          set -eu
          # Seed the Makefile's STORED_VERSION path with a semver 2.0.0 string.
          #
          # Upstream's default (git describe --tags --always) on this fork
          # returns a bare short-sha (no tags), so main.Version ends up as
          # "<sha>+gitea-1.22.0" -- not a parseable semver. /api/v1/version
          # returns that string, and act_runner v12.8.2 refuses to inject the
          # ACTIONS_RUNTIME_TOKEN when it cannot parse the server version
          # ("failed to determine token auth support"), which makes every
          # private-action clone fall back to an anonymous `git clone` that
          # a REQUIRE_SIGNIN_VIEW=true instance rejects with 401. Writing a
          # VERSION file here takes precedence over git-describe inside the
          # Makefile, and flows into -ldflags -X main.Version=... so the
          # endpoint reports it. (.dockerignore un-excludes /VERSION so the
          # build context picks this up.)
          #
          # 16.0.3 is the upstream Forgejo release this branch sits on top
          # of; bump it when rebasing onto a newer upstream.
          commit=$(git rev-parse --short=10 HEAD)
          version="16.0.3-project-api.${commit}"
          echo "$version" > VERSION
          echo "release=${version}" >> "$GITHUB_OUTPUT"

      # Dockerfile.rootless, not Dockerfile: the forgejo Helm chart deploys the
      # rootless image shape, and appends "-rootless" to image.tag when
      # image.rootless is true (its default). Both spellings are pushed so the
      # chart resolves either way.
      - name: Build image
        run: |
          set -eux
          docker build \
            -f Dockerfile.rootless \
            --build-arg RELEASE_VERSION="${{ steps.version.outputs.release }}" \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:${{ github.sha }}-rootless" \
            -t "$IMAGE:latest" \
            -t "$IMAGE:latest-rootless" \
            .

      - name: Push image
        run: |
          set -eux
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:${{ github.sha }}-rootless"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:latest-rootless"
